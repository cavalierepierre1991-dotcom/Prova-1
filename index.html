<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Rush V3 — Demo Ultimate</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 7px #000}
.top{position:absolute;top:15px;left:18px;right:18px;display:flex;justify-content:space-between}
.score{font-size:42px;font-weight:800}.small{font-size:13px;opacity:.8}.stats{text-align:right;font-size:13px}.stats b{font-size:25px}
.bar{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:34%;height:11px;border:1px solid #bdeeff;border-radius:8px;background:#0c2234aa;overflow:hidden}.fill{height:100%;width:67%;background:linear-gradient(90deg,#20baff,#e9fcff);box-shadow:0 0 16px #29caff}
.pause{pointer-events:auto;position:absolute;right:18px;top:60px;width:48px;height:48px;border-radius:50%;border:1px solid #d4f5ff;background:#112b40cc;color:white;font-size:20px}
.joy{pointer-events:auto;position:absolute;left:20px;bottom:25px;width:145px;height:145px;border:1px solid #d9f7ff88;border-radius:50%;background:#06152266}.stick{position:absolute;left:47px;top:47px;width:51px;height:51px;border-radius:50%;background:#e8f8ffaa;border:1px solid #fff}
.arrows{position:absolute;inset:0;text-align:center;line-height:47px;font-size:18px;color:#e5faff}.mid{font-size:27px}
.btn{pointer-events:auto;position:absolute;border-radius:50%;color:white;font-size:25px;border:1px solid #a9ecff;background:#082840dd;box-shadow:0 0 24px #29caff44}
.boost{right:20px;bottom:215px;width:62px;height:62px}.wing{right:22px;bottom:92px;width:88px;height:88px;font-size:36px;border:2px solid #75dcff;box-shadow:0 0 28px #29caff77}.shield{right:38px;bottom:25px;width:55px;height:55px}
.hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.65;white-space:nowrap}
#start{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 40%,#1c587c,#07111d 55%,#02060b)}
#start h1{font-size:56px;letter-spacing:3px;margin:0;text-shadow:0 0 26px #3bd5ff}.sub{letter-spacing:6px;color:#62dcff}
.play{margin-top:28px;padding:17px 52px;border-radius:12px;border:1px solid #a9edff;background:#0c4e73;color:white;font-size:22px;font-weight:bold;box-shadow:0 0 30px #2cc9ff55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><h1>SKY RUSH</h1><div class="sub">V3 — DEMO ULTIMATE</div><div style="margin-top:12px;opacity:.75">SIMULAZIONE DEL GIOCO FUTURO</div><button class="play" onclick="start()">GIOCA</button></div>
<div id="hud" style="display:none">
<div class="top"><div><div class="score" id="score">0</div><div class="small">PUNTEGGIO</div><div style="margin-top:10px">💎 120 &nbsp; 🪙 35</div></div><div class="stats">VELOCITÀ<br><b id="speed">245</b> km/h<br><span style="opacity:.7">DISTANZA <b id="dist">0.00</b> km</span></div></div>
<div class="bar"><div class="fill" id="fill"></div></div><button class="pause" onclick="pause()">Ⅱ</button>
<div class="joy" id="joy"><div class="arrows">▲<br><span class="mid">◀ ● ▶</span><br>▼</div><div class="stick" id="stick"></div></div>
<button class="btn boost" id="boost">▲</button><button class="btn wing" id="wing">🪽</button><button class="btn shield">◇</button>
<div class="hint">TRASCINA IL JOYSTICK PER VOLARE • USA 🪽 PER LO SCATTO</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=1,t=0,running=false,paused=false,score=0,dist=0,boost=false,px=0,py=0,joyX=0,joyY=0;
const islands=[];for(let i=0;i<36;i++)islands.push({x:(Math.random()-.5)*1.9,z:i/36*1.2+.05,s:18+Math.random()*45,seed:Math.random()});
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function start(){document.getElementById('start').style.display='none';document.getElementById('hud').style.display='block';running=true}
function pause(){paused=!paused}
function project(ix,iy,z){let depth=1+z*3.2, sx=W/2+(ix-px)*W*.62/depth, sy=H*.52+(iy-py)*H*.55/depth+z*H*.30;return[sx,sy,depth]}
function mountain(cx,cy,s,seed){x.beginPath();x.moveTo(cx-s,cy);x.lineTo(cx-s*.55,cy-s*.65);x.lineTo(cx-s*.2,cy-s*1.05*(.8+seed));x.lineTo(cx+s*.18,cy-s*.45);x.lineTo(cx+s*.55,cy-s*.82);x.lineTo(cx+s,cy);x.closePath();let g=x.createLinearGradient(0,cy-s,0,cy);g.addColorStop(0,'#7e9f9d');g.addColorStop(1,'#263f49');x.fillStyle=g;x.fill()}
function draw(){x.clearRect(0,0,W,H);
let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#4c9ac5');sky.addColorStop(.5,'#b9e2ef');sky.addColorStop(1,'#29576b');x.fillStyle=sky;x.fillRect(0,0,W,H);
for(let i=0;i<18;i++){let cx=(i*137+t*7)% (W+240)-120, cy=80+(i*67)%220; x.globalAlpha=.18;x.fillStyle='#fff';x.beginPath();x.ellipse(cx,cy,80,18,0,0,7);x.fill()}x.globalAlpha=1;
let sun=x.createRadialGradient(W*.78,H*.18,5,W*.78,H*.18,180);sun.addColorStop(0,'#fff9df');sun.addColorStop(1,'#fff0b000');x.fillStyle=sun;x.fillRect(0,0,W,H);
for(let i=islands.length-1;i>=0;i--){let a=islands[i],z=(a.z+t*.0009)%1.25;let p=project(a.x,0,z),s=a.s/p[2];if(p[1]>H+100)continue;mountain(p[0],p[1],s,a.seed);x.fillStyle='#4f815d';x.beginPath();x.ellipse(p[0],p[1],s*.8,s*.25,0,0,7);x.fill();
for(let j=0;j<4;j++){let tx=p[0]+(j-1.5)*s*.3,ty=p[1]-s*.18; x.fillStyle='#1f5845';x.beginPath();x.moveTo(tx,ty);x.lineTo(tx-s*.09,ty+s*.28);x.lineTo(tx+s*.09,ty+s*.28);x.closePath();x.fill()}}
/* floating crystals */for(let i=0;i<14;i++){let z=(i/14+t*.001)%1.1,p=project((i%2?-.7:.7),-.1,z),s=7/p[2];x.fillStyle='#65e5ff';x.globalAlpha=.65;x.beginPath();x.moveTo(p[0],p[1]-s*2);x.lineTo(p[0]+s,p[1]);x.lineTo(p[0],p[1]+s*2);x.lineTo(p[0]-s,p[1]);x.closePath();x.fill()}x.globalAlpha=1;
/* player */let cx=W/2,cy=H*.52; x.save();x.translate(cx,cy);x.rotate(-joyX*.16);let scale=Math.max(.7,Math.min(1.25,H/850));x.scale(scale,scale);
x.fillStyle='rgba(10,20,30,.35)';x.beginPath();x.ellipse(0,24,95,15,0,0,7);x.fill();
x.fillStyle='#172b42';x.beginPath();x.moveTo(-18,5);x.lineTo(-105,55);x.lineTo(-60,5);x.lineTo(-90,-25);x.lineTo(-8,-5);x.closePath();x.fill();
x.fillStyle='#9cecff';x.shadowBlur=20;x.shadowColor='#36d8ff';x.beginPath();x.moveTo(-12,-8);x.lineTo(-105,-45);x.lineTo(-22,3);x.closePath();x.fill();x.beginPath();x.moveTo(12,-8);x.lineTo(105,-45);x.lineTo(22,3);x.closePath();x.fill();x.shadowBlur=0;
x.fillStyle='#283f54';x.beginPath();x.ellipse(0,0,16,32,0,0,7);x.fill();x.fillStyle='#d39a78';x.beginPath();x.arc(0,-30,14,0,7);x.fill();x.fillStyle='#17283a';x.beginPath();x.arc(0,-35,15,Math.PI,7);x.fill();x.restore();
if(boost){x.globalAlpha=.7;for(let i=0;i<8;i++){x.fillStyle='#66ddff';x.fillRect(W/2+(Math.random()-.5)*25,H*.55+i*18,2,15)}}x.globalAlpha=1}
function loop(){requestAnimationFrame(loop);if(running&&!paused){t+=16;let v=boost?2.3:1;px+=(joyX*0.012);py-=joyY*0.008;px*=.96;py*=.96;score+=Math.round(v*2);dist+=v*.0008;document.getElementById('score').textContent=score.toLocaleString('it-IT');document.getElementById('speed').textContent=boost?420:245;document.getElementById('dist').textContent=dist.toFixed(2);document.getElementById('fill').style.width=(60+Math.sin(t*.001)*9)+'%'}draw()}loop();
function move(e){let r=document.getElementById('joy').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joyX=Math.cos(a)*m/48;joyY=Math.sin(a)*m/48;document.getElementById('stick').style.transform=`translate(${joyX*45}px,${joyY*45}px)`}
let drag=false;joy.addEventListener('pointerdown',e=>{drag=true;joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>drag&&move(e));joy.addEventListener('pointerup',()=>{drag=false;joyX=joyY=0;stick.style.transform='translate(0,0)'});
wing.addEventListener('pointerdown',()=>{boost=true;setTimeout(()=>boost=false,900)});boostBtn=document.getElementById('boost');boostBtn.addEventListener('pointerdown',()=>boost=true);boostBtn.addEventListener('pointerup',()=>boost=false);
</script></body></html>
