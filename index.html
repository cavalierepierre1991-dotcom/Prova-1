<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Rush V3 — Demo Ultimate</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b14;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}
.score{font-size:42px;font-weight:800}.small{font-size:13px;opacity:.8}
.stats{text-align:right;font-size:14px}.stats b{font-size:25px}
.bar{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:34%;height:12px;border:1px solid #9be8ff;border-radius:9px;background:#102637aa;overflow:hidden}
.fill{height:100%;width:67%;background:linear-gradient(90deg,#22b9ff,#d9fbff);box-shadow:0 0 15px #22b9ff}
.pause{position:absolute;right:18px;top:62px;width:48px;height:48px;border-radius:50%;border:1px solid #bcefff;background:#102436bb;color:white;font-size:20px}
.controls{position:absolute;inset:0}.joy{position:absolute;left:22px;bottom:28px;width:145px;height:145px;border:1px solid #c9efff88;border-radius:50%;background:#07152266}
.stick{position:absolute;left:47px;top:47px;width:51px;height:51px;border-radius:50%;background:#dbefffaa;border:1px solid white}
.arrows{position:absolute;inset:0;font-size:22px;color:#d9f8ff;text-align:center;line-height:145px}.up{position:absolute;right:22px;bottom:220px;width:64px;height:64px;border-radius:50%;border:1px solid #8be8ff;background:#09263bcc;font-size:25px;color:white}
.ability{position:absolute;right:25px;bottom:95px;width:86px;height:86px;border-radius:50%;border:2px solid #79dcff;background:#062641cc;box-shadow:0 0 25px #29bfff88;font-size:36px;color:#d9f7ff}
.shield{position:absolute;right:39px;bottom:28px;width:55px;height:55px;border-radius:50%;border:1px solid #bdefff;background:#0b2033cc;color:white;font-size:25px}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.65}
#start{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#1a4c70 0,#07111d 52%,#02060b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5}
#start h1{font-size:58px;margin:0;letter-spacing:3px;text-shadow:0 0 25px #3bd5ff}.sub{letter-spacing:6px;color:#54d8ff}
button.play{margin-top:30px;padding:18px 54px;border-radius:12px;border:1px solid #9beeff;background:#0d4c72;color:white;font-size:23px;font-weight:bold;box-shadow:0 0 30px #2cc9ff55}
#loading{position:absolute;bottom:18%;opacity:.65}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="start"><h1>SKY RUSH</h1><div class="sub">V3 — DEMO ULTIMATE</div><div style="margin-top:12px;opacity:.75">SIMULAZIONE DEL GIOCO FUTURO</div><button class="play" onclick="startGame()">GIOCA</button><div id="loading">3D • VOLO LIBERO • TOUCH • ABILITÀ</div></div>
<div id="hud" style="display:none">
 <div class="top"><div><div class="score" id="score">0</div><div class="small">PUNTEGGIO</div><div style="margin-top:12px">💎 120 &nbsp; 🪙 35</div></div><div class="stats">VELOCITÀ<br><b id="speed">245</b> km/h<br><span style="opacity:.7">DISTANZA <b id="dist">0.00</b> km</span></div></div>
 <div class="bar"><div class="fill" id="fill"></div></div><button class="pause" onclick="togglePause()">Ⅱ</button>
 <div class="controls"><div class="joy"><div class="arrows">▲<br><span style="font-size:30px">◀ ● ▶</span><br>▼</div><div class="stick" id="stick"></div></div><button class="up" ontouchstart="boost=true" ontouchend="boost=false">▲</button><button class="ability" ontouchstart="ability()">🪽</button><button class="shield">◇</button><div class="hint">Trascina il joystick per volare • usa 🪽 per lo scatto</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,player,started=false,paused=false,boost=false,score=0,dist=0,t=0;
const keys={}; let joy={x:0,y:0}, dragging=false;
function startGame(){document.getElementById('start').style.display='none';document.getElementById('hud').style.display='block';init();}
function init(){
 scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x87b9d6,.00045);
 camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,4000);
 renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
 scene.background=new THREE.Color(0x79b6da);
 scene.add(new THREE.HemisphereLight(0xdff7ff,0x31516c,2.1));
 const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-300,500,200);sun.castShadow=true;scene.add(sun);
 createWorld(); createPlayer(); addEvents(); animate();
}
function mat(c,rough=1,emit=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.15,emissive:emit?c:0,emissiveIntensity:emit});}
function createWorld(){
 // ocean/terrain
 let ground=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),mat(0x2f6e73));ground.rotation.x=-Math.PI/2;ground.position.y=-120;scene.add(ground);
 for(let i=0;i<42;i++){
  let x=(Math.random()-.5)*1500,y=(Math.random()-.5)*650,z=-i*150-100;
  let r=25+Math.random()*65;
  let island=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.55,35+Math.random()*60,9),mat(0x45685b));
  island.position.set(x,y,z); island.rotation.y=Math.random()*3; island.castShadow=true;scene.add(island);
  let top=new THREE.Mesh(new THREE.CylinderGeometry(r*.98,r*.98,5,9),mat(0x6f9a68));top.position.set(x,y+20,z);scene.add(top);
  for(let j=0;j<4;j++){let tr=new THREE.Mesh(new THREE.ConeGeometry(5,18+Math.random()*20,7),mat(0x285b43));tr.position.set(x+(Math.random()-.5)*r,y+30,z+(Math.random()-.5)*r);scene.add(tr)}
 }
 // floating crystals
 for(let i=0;i<28;i++){let c=new THREE.Mesh(new THREE.OctahedronGeometry(5+Math.random()*5),mat(0x4ad7ff,.4,1));c.position.set((Math.random()-.5)*1000,(Math.random()-.5)*500,-300-Math.random()*3000);scene.add(c)}
}
function createPlayer(){
 player=new THREE.Group();
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(3.5,10,8,16),mat(0x26384b,.45));body.rotation.x=Math.PI/2;body.castShadow=true;player.add(body);
 let head=new THREE.Mesh(new THREE.SphereGeometry(3.4,18,14),mat(0xd29a78));head.position.z=7;player.add(head);
 let cape=new THREE.Mesh(new THREE.ConeGeometry(8,17,4),mat(0x17283d,.5));cape.rotation.x=-Math.PI/2;cape.position.z=-9;cape.scale.y=1.7;player.add(cape);
 let wingMat=mat(0x8feaff,.3,1);
 for(let s of [-1,1]){let w=new THREE.Mesh(new THREE.PlaneGeometry(22,6),wingMat);w.position.set(12*s,1,0);w.rotation.z=.25*s;player.add(w)}
 player.position.set(0,0,5);scene.add(player);
}
function addEvents(){
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 const j=document.querySelector('.joy'),s=document.getElementById('stick');
 function move(x,y){let r=j.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);let m=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/48;joy.y=Math.sin(a)*m/48;s.style.transform=`translate(${joy.x*45}px,${joy.y*45}px)`}
 j.addEventListener('pointerdown',e=>{dragging=true;j.setPointerCapture(e.pointerId);move(e.clientX,e.clientY)});j.addEventListener('pointermove',e=>dragging&&move(e.clientX,e.clientY));j.addEventListener('pointerup',()=>{dragging=false;joy.x=joy.y=0;s.style.transform='translate(0,0)'});
}
function ability(){boost=true;setTimeout(()=>boost=false,900)}
function togglePause(){paused=!paused}
function animate(){
 requestAnimationFrame(animate); if(!started){started=true}
 if(!paused){
  t+=.016; let v=boost?2.4:1.25; dist+=v*.016*.06; score+=Math.round(v);
  let x=(joy.x+(keys.d?1:0)-(keys.a?1:0))*1.15, y=-(joy.y+(keys.s?1:0)-(keys.w?1:0))*1.0;
  player.position.x+=x;player.position.y+=y;player.position.y=Math.max(-70,Math.min(210,player.position.y));
  player.rotation.z=-x*.35;player.rotation.x=y*.22;player.rotation.y=-x*.15;
  camera.position.lerp(new THREE.Vector3(player.position.x*.18,player.position.y+24,player.position.z+55),.08);
  camera.lookAt(player.position.x,player.position.y,player.position.z-90);
  document.getElementById('score').textContent=score.toLocaleString('it-IT');document.getElementById('speed').textContent=boost?420:245;document.getElementById('dist').textContent=dist.toFixed(2);
  document.getElementById('fill').style.width=(55+Math.sin(t*.5)*12)+'%';
 }
 renderer.render(scene,camera);
}
</script>
</body></html>
